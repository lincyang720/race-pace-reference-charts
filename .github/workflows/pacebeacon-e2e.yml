name: PaceBeacon browser acceptance tests
on:
  push:
    branches: [main]
    paths: ['tests/**', '.github/workflows/pacebeacon-e2e.yml', 'src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve website and test calculators
        run: |
          python3 -m http.server 8765 --directory src > /tmp/pacebeacon-server.log 2>&1 &
          sleep 2
          node tests/e2e.cjs
